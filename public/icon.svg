<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#5b21b6" />
    </linearGradient>
    <linearGradient id="robotGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Robot Antenna -->
  <line x1="256" y1="120" x2="256" y2="70" stroke="#ffffff" stroke-width="14" stroke-linecap="round" />
  <circle cx="256" cy="60" r="22" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="256" cy="60" r="14" fill="#ffffff" />

  <!-- Ears / Side Bolts -->
  <rect x="100" y="200" width="30" height="70" rx="12" fill="#e2e8f0" />
  <circle cx="115" cy="235" r="8" fill="#7c3aed" />
  <rect x="382" y="200" width="30" height="70" rx="12" fill="#e2e8f0" />
  <circle cx="397" cy="235" r="8" fill="#7c3aed" />

  <!-- Robot Head -->
  <rect x="120" y="110" width="272" height="210" rx="55" fill="url(#robotGrad)" stroke="#cbd5e1" stroke-width="4" />

  <!-- Visor Screen -->
  <rect x="150" y="145" width="212" height="120" rx="35" fill="url(#visorGrad)" stroke="#4338ca" stroke-width="3" />

  <!-- Expressive Friendly Eyes -->
  <ellipse cx="205" cy="200" rx="28" ry="24" fill="#38bdf8" filter="url(#glow)" />
  <ellipse cx="205" cy="200" rx="20" ry="18" fill="#67e8f9" />
  <circle cx="198" cy="193" r="8" fill="#ffffff" />

  <!-- Right Eye -->
  <ellipse cx="307" cy="200" rx="28" ry="24" fill="#38bdf8" filter="url(#glow)" />
  <ellipse cx="307" cy="200" rx="20" ry="18" fill="#67e8f9" />
  <circle cx="300" cy="193" r="8" fill="#ffffff" />

  <!-- Cute Smile on Visor -->
  <path d="M 232 235 Q 256 252 280 235" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />

  <!-- Cheeks blush -->
  <circle cx="175" cy="230" r="10" fill="#f43f5e" opacity="0.5" />
  <circle cx="337" cy="230" r="10" fill="#f43f5e" opacity="0.5" />

  <!-- Body / Neck -->
  <rect x="228" y="320" width="56" height="28" rx="8" fill="#94a3b8" />
  <path d="M 160 348 C 160 348, 200 338, 256 338 C 312 338, 352 348, 352 348 L 372 450 C 372 450, 312 470, 256 470 C 200 470, 140 450, 140 450 Z" fill="url(#robotGrad)" />

  <!-- Core Chest light -->
  <circle cx="256" cy="405" r="28" fill="#7c3aed" />
  <path d="M 256 388 L 263 401 L 277 401 L 266 410 L 270 423 L 256 414 L 242 423 L 246 410 L 235 401 L 249 401 Z" fill="#38bdf8" filter="url(#glow)" />

  <!-- Panca AI Badge text -->
  <text x="256" y="492" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="3">PANCA AI</text>
</svg>
